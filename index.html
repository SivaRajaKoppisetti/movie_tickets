<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍿 CineVerse · movie ticket booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .booking-app {
            max-width: 1100px;
            width: 100%;
            background: rgba(22, 26, 40, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 36px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 100, 0.2);
            padding: 28px 30px 30px;
            color: #f0f3ff;
            border: 1px solid rgba(255, 220, 120, 0.15);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        h1 span {
            background: linear-gradient(135deg, #ffd966, #f5b042);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .subhead {
            font-size: 0.95rem;
            color: #9aa4c2;
            margin-bottom: 28px;
            border-left: 3px solid #f5b042;
            padding-left: 16px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 32px;
        }

        .movie-card {
            background: #1e2338;
            border-radius: 24px;
            padding: 20px 16px 18px;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 0 #0e111c;
            cursor: pointer;
        }

        .movie-card.selected {
            border: 2px solid #f5b042;
            background: #2a2f4a;
            box-shadow: 0 0 20px rgba(245, 176, 66, 0.3), 0 8px 0 #0e111c;
            transform: translateY(-2px);
        }

        .movie-poster {
            font-size: 3.2rem;
            text-align: center;
            margin-bottom: 6px;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.6));
        }

        .movie-title {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: -0.2px;
            margin-bottom: 6px;
            color: #fff;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #a0a9c9;
            margin-bottom: 10px;
        }

        .price {
            font-weight: 700;
            color: #f5b042;
            font-size: 1.2rem;
            margin-top: 6px;
            letter-spacing: -0.3px;
        }

        .price small {
            font-size: 0.7rem;
            font-weight: 400;
            color: #9aa4c2;
            margin-left: 4px;
        }

        .showtime-section {
            background: #121624;
            border-radius: 32px;
            padding: 22px 20px 26px;
            margin-bottom: 26px;
            border: 1px solid rgba(255, 215, 100, 0.1);
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #b9c2e0;
            margin-bottom: 18px;
            letter-spacing: 0.3px;
        }

        .section-label i {
            font-style: normal;
            font-size: 1.3rem;
        }

        .timeslots {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .time-btn {
            background: #252b42;
            border: none;
            color: #eef2ff;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 0 #0b0e18;
            border: 1px solid #353d5e;
            flex: 0 1 auto;
        }

        .time-btn.selected {
            background: #f5b042;
            color: #0b0e1a;
            box-shadow: 0 0 14px #f5b04280, 0 4px 0 #a06e1a;
            border-color: #ffd966;
            font-weight: 600;
        }

        .time-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0b0e18;
        }

        .seat-area {
            background: #121624;
            border-radius: 32px;
            padding: 18px 20px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 215, 100, 0.1);
        }

        .screen-indicator {
            text-align: center;
            margin: 6px 0 28px;
            position: relative;
        }

        .screen-indicator span {
            display: inline-block;
            background: #2b324f;
            padding: 6px 40px;
            border-radius: 40px;
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: #b9c2e0;
            font-weight: 400;
            box-shadow: 0 10px 20px -10px #00000080;
        }

        .screen-indicator::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5b04230, #f5b04260, #f5b04230, transparent);
            transform: translateY(-50%);
            z-index: 0;
        }

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 12px 8px;
            justify-content: center;
            margin: 0 auto 12px;
            max-width: 500px;
        }

        .seat {
            aspect-ratio: 1 / 0.9;
            background: #2f3652;
            border-radius: 12px 12px 6px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #b9c2e0;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 3px 0 #0d101b;
            border: 1px solid #3e466b;
            user-select: none;
        }

        .seat.selected {
            background: #f5b042;
            color: #0b0e1a;
            box-shadow: 0 0 12px #f5b042, 0 3px 0 #a06e1a;
            border-color: #ffd966;
            font-weight: 700;
            transform: scale(1.02);
        }

        .seat.occupied {
            background: #3a2a2a;
            color: #6a5a5a;
            box-shadow: inset 0 0 0 1px #4d3a3a;
            border-color: #4d3a3a;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.6;
        }

        .seat.available:hover {
            background: #3e466b;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #9aa4c2;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 6px;
            background: #2f3652;
        }

        .legend-box.selected {
            background: #f5b042;
        }

        .legend-box.occupied {
            background: #3a2a2a;
        }

        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #1b2032;
            border-radius: 60px;
            padding: 12px 26px 12px 30px;
            border: 1px solid #f5b04230;
            margin-top: 6px;
            box-shadow: 0 10px 20px -10px #00000080;
        }

        .summary-left {
            display: flex;
            align-items: center;
            gap: 26px;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
        }

        .summary-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8d97b5;
        }

        .summary-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #f0f3ff;
        }

        .total-price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f5b042;
            letter-spacing: -0.5px;
        }

        .book-btn {
            background: linear-gradient(145deg, #f5b042, #e09d2c);
            border: none;
            border-radius: 40px;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0b0e1a;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 8px 0 #8f631c, 0 0 18px #f5b04260;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .book-btn:active {
            transform: translateY(3px);
            box-shadow: 0 5px 0 #8f631c, 0 0 18px #f5b04260;
        }

        .book-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            box-shadow: 0 4px 0 #5a401a;
            filter: grayscale(0.6);
        }

        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e243b;
            color: #f5b042;
            border: 1px solid #f5b042;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 20px 40px #00000080;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            letter-spacing: 0.3px;
            backdrop-filter: blur(8px);
        }

        .toast-message.show {
            opacity: 1;
            pointer-events: auto;
        }

        .hidden {
            display: none;
        }

        /* responsive */
        @media (max-width: 650px) {
            .booking-app { padding: 20px 16px; }
            h1 { font-size: 1.7rem; }
            .seat-grid { gap: 6px; max-width: 100%; }
            .seat { font-size: 0.55rem; }
            .summary-bar { flex-direction: column; align-items: stretch; gap: 16px; border-radius: 40px; padding: 18px; }
            .book-btn { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="booking-app">
    <h1>
        <span>🎬 CineVerse</span>
    </h1>
    <div class="subhead">Pick a movie · choose showtime · select seats</div>

    <!-- Movie selection -->
    <div class="movie-grid" id="movieGrid">
        <!-- filled by JS -->
    </div>

    <!-- Showtime section -->
    <div class="showtime-section">
        <div class="section-label"><i>⏰</i> Select showtime</div>
        <div class="timeslots" id="timeslotContainer"></div>
    </div>

    <!-- Seat selection -->
    <div class="seat-area">
        <div class="section-label"><i>💺</i> Choose your seats</div>
        <div class="screen-indicator">
            <span>SCREEN</span>
        </div>
        <div class="seat-grid" id="seatGrid"></div>
        <div class="legend">
            <div class="legend-item"><div class="legend-box"></div> Available</div>
            <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
            <div class="legend-item"><div class="legend-box occupied"></div> Occupied</div>
        </div>
    </div>

    <!-- Summary & book -->
    <div class="summary-bar">
        <div class="summary-left">
            <div class="summary-item">
                <span class="summary-label">Movie</span>
                <span class="summary-value" id="selectedMovieName">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Showtime</span>
                <span class="summary-value" id="selectedTime">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Seats</span>
                <span class="summary-value" id="selectedSeatsList">0</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="total-price" id="totalPrice">$0</div>
            <button class="book-btn" id="bookBtn" disabled>🎟️ Book now</button>
        </div>
    </div>
</div>

<div class="toast-message" id="toast">🎉 Booking confirmed!</div>

<script>
    (function() {
        // ---------- MOVIE DATA ----------
        const movies = [
            { id: 'm1', title: 'Dune: Part Two', emoji: '🏜️', duration: '2h 46m', rating: 'PG-13', price: 16.5 },
            { id: 'm2', title: 'Oppenheimer', emoji: '⚛️', duration: '3h 0m', rating: 'R', price: 14.0 },
            { id: 'm3', title: 'Barbie', emoji: '💖', duration: '1h 54m', rating: 'PG-13', price: 13.5 },
            { id: 'm4', title: 'The Batman', emoji: '🦇', duration: '2h 56m', rating: 'PG-13', price: 15.0 }
        ];

        // showtimes per movie
        const showtimes = {
            m1: ['10:30 AM', '1:45 PM', '5:00 PM', '8:30 PM'],
            m2: ['11:00 AM', '3:15 PM', '7:00 PM', '10:15 PM'],
            m3: ['9:45 AM', '12:30 PM', '4:20 PM', '9:00 PM'],
            m4: ['10:00 AM', '2:30 PM', '6:45 PM', '10:00 PM']
        };

        // ---------- STATE ----------
        let currentMovieId = 'm1';               // default first movie
        let currentShowtime = showtimes['m1'][0]; // default first time
        let selectedSeats = new Set();           // holds seat numbers like "A1"

        // ---------- DOM REFS ----------
        const movieGrid = document.getElementById('movieGrid');
        const timeslotContainer = document.getElementById('timeslotContainer');
        const seatGrid = document.getElementById('seatGrid');
        const selectedMovieName = document.getElementById('selectedMovieName');
        const selectedTime = document.getElementById('selectedTime');
        const selectedSeatsList = document.getElementById('selectedSeatsList');
        const totalPriceEl = document.getElementById('totalPrice');
        const bookBtn = document.getElementById('bookBtn');
        const toast = document.getElementById('toast');

        // ---------- HELPER: generate occupied seats (deterministic per movie+showtime) ----------
        function getOccupiedSeats(movieId, showtime) {
            // simple hash to get pseudo-random but consistent occupied seats
            const hash = (movieId + showtime).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const occupied = new Set();
            const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
            const cols = 8; // 1..8
            // occupy about 30% of seats
            for (let r = 0; r < rows.length; r++) {
                for (let c = 1; c <= cols; c++) {
                    const seatId = `${rows[r]}${c}`;
                    // deterministic condition using hash + row/col
                    if ((hash + r * 13 + c * 7) % 4 === 0) {
                        occupied.add(seatId);
                    }
                }
            }
            // also make sure some seats are always occupied for variety (but deterministic)
            if (occupied.size < 8) {
                // add a few more
                occupied.add('A3');
                occupied.add('B6');
                occupied.add('C1');
                occupied.add('D8');
                occupied.add('E2');
                occupied.add('F5');
            }
            return occupied;
        }

        // ---------- RENDER MOVIE CARDS ----------
        function renderMovies() {
            movieGrid.innerHTML = '';
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = `movie-card ${movie.id === currentMovieId ? 'selected' : ''}`;
                card.dataset.movieId = movie.id;
                card.innerHTML = `
                    <div class="movie-poster">${movie.emoji}</div>
                    <div class="movie-title">${movie.title}</div>
                    <div class="movie-meta">
                        <span>${movie.duration}</span>
                        <span>${movie.rating}</span>
                    </div>
                    <div class="price">$${movie.price.toFixed(2)} <small>per seat</small></div>
                `;
                card.addEventListener('click', () => selectMovie(movie.id));
                movieGrid.appendChild(card);
            });
        }

        // ---------- SELECT MOVIE (reset showtime and seats) ----------
        function selectMovie(movieId) {
            if (currentMovieId === movieId) return;
            currentMovieId = movieId;
            // set default showtime for that movie
            currentShowtime = showtimes[movieId][0];
            // clear selected seats
            selectedSeats.clear();
            // re-render all UI
            renderMovies();
            renderTimeslots();
            renderSeats();
            updateSummary();
        }

        // ---------- RENDER TIMESLOTS ----------
        function renderTimeslots() {
            const times = showtimes[currentMovieId] || [];
            if (!times.includes(currentShowtime)) {
                currentShowtime = times[0] || '';
            }
            timeslotContainer.innerHTML = '';
            times.forEach(time => {
                const btn = document.createElement('button');
                btn.className = `time-btn ${time === currentShowtime ? 'selected' : ''}`;
                btn.textContent = time;
                btn.dataset.time = time;
                btn.addEventListener('click', () => {
                    if (currentShowtime === time) return;
                    currentShowtime = time;
                    selectedSeats.clear();  // clear seats when showtime changes
                    renderTimeslots();
                    renderSeats();
                    updateSummary();
                });
                timeslotContainer.appendChild(btn);
            });
        }

        // ---------- RENDER SEATS (6 rows x 8 cols) ----------
        function renderSeats() {
            const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
            const cols = 8;
            const occupiedSet = getOccupiedSeats(currentMovieId, currentShowtime);

            seatGrid.innerHTML = '';
            rows.forEach(row => {
                for (let col = 1; col <= cols; col++) {
                    const seatId = `${row}${col}`;
                    const seatDiv = document.createElement('div');
                    seatDiv.className = 'seat';
                    if (occupiedSet.has(seatId)) {
                        seatDiv.classList.add('occupied');
                    } else {
                        seatDiv.classList.add('available');
                        if (selectedSeats.has(seatId)) {
                            seatDiv.classList.add('selected');
                        }
                    }
                    seatDiv.textContent = seatId;
                    seatDiv.dataset.seatId = seatId;

                    // only allow click if not occupied
                    if (!occupiedSet.has(seatId)) {
                        seatDiv.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleSeat(seatId);
                        });
                    }
                    seatGrid.appendChild(seatDiv);
                }
            });
        }

        // ---------- TOGGLE SEAT SELECTION ----------
        function toggleSeat(seatId) {
            if (selectedSeats.has(seatId)) {
                selectedSeats.delete(seatId);
            } else {
                selectedSeats.add(seatId);
            }
            // re-render only seats (to avoid full refresh of occupied state, but it's fine)
            renderSeats();    // quick re-render (small grid)
            updateSummary();
        }

        // ---------- UPDATE SUMMARY BAR ----------
        function updateSummary() {
            const movie = movies.find(m => m.id === currentMovieId);
            if (!movie) return;

            // movie name
            selectedMovieName.textContent = movie.title;
            // showtime
            selectedTime.textContent = currentShowtime || '—';
            // seats count & total price
            const seatCount = selectedSeats.size;
            if (seatCount === 0) {
                selectedSeatsList.textContent = '0';
                totalPriceEl.textContent = '$0';
                bookBtn.disabled = true;
            } else {
                // show seat list like A1, B2
                const sortedSeats = Array.from(selectedSeats).sort((a, b) => {
                    const rowA = a[0], rowB = b[0];
                    if (rowA !== rowB) return rowA.localeCompare(rowB);
                    return parseInt(a.slice(1)) - parseInt(b.slice(1));
                });
                selectedSeatsList.textContent = sortedSeats.join(', ');
                const total = seatCount * movie.price;
                totalPriceEl.textContent = `$${total.toFixed(2)}`;
                bookBtn.disabled = false;
            }
        }

        // ---------- BOOK BUTTON HANDLER ----------
        function handleBooking() {
            if (selectedSeats.size === 0) return;

            const movie = movies.find(m => m.id === currentMovieId);
            const seatCount = selectedSeats.size;
            const total = (seatCount * movie.price).toFixed(2);
            const seatList = Array.from(selectedSeats).sort().join(', ');

            // show toast with details
            toast.textContent = `🎉 Booked ${seatCount} seat${seatCount > 1 ? 's' : ''} for "${movie.title}" · ${currentShowtime} · $${total}`;
            toast.classList.add('show');

            // clear selected seats after booking (simulate successful order)
            selectedSeats.clear();
            renderSeats();
            updateSummary();

            // hide toast after 3.5s
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ---------- INITIALIZE ----------
        function init() {
            // ensure showtime set for default movie
            currentShowtime = showtimes[currentMovieId][0];
            renderMovies();
            renderTimeslots();
            renderSeats();
            updateSummary();

            // attach book button event
            bookBtn.addEventListener('click', handleBooking);
        }

        init();
    })();
</script>
</body>
</html>
